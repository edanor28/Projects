name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Audit root dependencies (fail on high)
        run: npm audit --audit-level=high

      - name: Run server tests
        run: |
          cd server
          npm ci
          npm test

      - name: Audit server dependencies (fail on high)
        run: |
          cd server
          npm audit --audit-level=high
